<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080d15"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080d15;color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif}body{min-height:100vh}button,input,textarea{font:inherit}.app{max-width:720px;margin:auto;padding:18px 18px 96px}.brand{font-size:32px;font-weight:800;letter-spacing:-1px}.sub{color:#96a5b8;font-size:14px;line-height:1.45;margin:5px 0 18px}.card{background:#111a27;border:1px solid #1b2839;border-radius:22px;padding:16px;margin:10px 0}.hero{padding:19px}.eyebrow{font-size:11px;color:#8ff3c8;font-weight:800;letter-spacing:1.5px}.score{font-size:48px;font-weight:850;letter-spacing:-2px;margin:2px 0 10px}.bar{height:8px;background:#1d2a3c;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8ff3c8,#5cc8ff);border-radius:99px}.muted{color:#96a5b8}.section{font-size:14px;font-weight:800;margin:22px 0 8px}.title{font-weight:800;font-size:18px}.big{font-size:27px;font-weight:850}.row{display:flex;gap:9px}.row>*{flex:1}.mini{text-align:center;padding:14px 7px}.mini b{display:block;font-size:20px;margin-bottom:2px}.mint{color:#8ff3c8}.blue{color:#5cc8ff}.amber{color:#ffca77}.line{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #1c2939}.line:last-child{border:0}.btn{border:0;border-radius:15px;padding:13px 14px;font-weight:800;background:#8ff3c8;color:#07120e;min-height:46px}.btn.dark{background:#1b293a;color:#f4f7fb}.btn.warn{background:#ffca77}.btn:active{transform:scale(.985)}.counter{display:flex;align-items:center;justify-content:space-between;gap:12px}.counter .value{font-size:24px;font-weight:850}.controls{display:flex;gap:8px;margin-top:12px}.controls button{flex:1}.time{width:100%;text-align:left;background:#1b293a;color:#fff;border:0;border-radius:16px;padding:13px 15px;font-size:29px;font-weight:850;margin-top:6px}.preset{font-size:13px;padding:11px 5px}.scale{display:flex;gap:7px;margin-top:9px}.scale button{flex:1;border:1px solid #2a3a50;background:#172231;color:#9baabc;border-radius:13px;height:44px;font-weight:800}.scale button.on{background:#8ff3c8;color:#07120e;border-color:#8ff3c8}.note{width:100%;min-height:150px;resize:none;border:1px solid #29384d;border-radius:16px;background:#172231;color:#fff;padding:13px;outline:none;line-height:1.5}.switch{width:50px;height:29px;border-radius:99px;background:#26354a;position:relative;flex:none}.switch:after{content:"";width:23px;height:23px;position:absolute;left:3px;top:3px;border-radius:50%;background:#8494a8;transition:.2s}.switch.on{background:#8ff3c8}.switch.on:after{left:24px;background:#07120e}.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:14px}.breath{height:110px;display:flex;align-items:center;justify-content:center}.orb{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c7ffe9,#8ff3c8 42%,#4eaad8);box-shadow:0 0 35px #5cc8ff33}.orb.go{animation:breathe 8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.78)}50%{transform:scale(1.35)}}.history{white-space:pre-wrap;line-height:1.5}.empty{text-align:center;color:#75869c;padding:24px}.nav{position:fixed;left:0;right:0;bottom:0;background:#080d15ee;backdrop-filter:blur(16px);border-top:1px solid #1a2737;padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:flex;z-index:10}.nav button{flex:1;border:0;background:transparent;color:#8392a6;border-radius:13px;height:48px;font-size:11px;font-weight:750}.nav button.on{background:#8ff3c8;color:#07120e}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#eefbf6;color:#0a1713;padding:10px 15px;border-radius:99px;font-size:13px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}.hidden{display:none!important}
</style></head><body><main id="app" class="app"></main><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s), app=$('#app'), nav=$('#nav');
const defaults={sleep:180,wake:660,reminders:false};
const get=(k,d)=>{let v=localStorage.getItem(k);return v===null?d:JSON.parse(v)},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cfg={...defaults,...get('cfg',{})},tab='today',breathTimer=null;
const norm=m=>(m%1440+1440)%1440, fmt=m=>`${String(Math.floor(norm(m)/60)).padStart(2,'0')}:${String(norm(m)%60).padStart(2,'0')}`,ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function dayKey(){let d=new Date(),m=d.getHours()*60+d.getMinutes();if(m<cfg.wake)d.setDate(d.getDate()-1);return ymd(d)}
function data(day=dayKey()){return get('d:'+day,{water:0,move:0,light:0,caffeine:0,energy:0,mood:0,checkin:false,gentle:false,lateCaffeine:false,note:''})}
function save(d){set('d:'+dayKey(),d)}
function lastDays(n=7){let base=new Date(dayKey()+'T12:00:00'),a=[];for(let i=0;i<n;i++){let d=new Date(base);d.setDate(base.getDate()-i);a.push(ymd(d))}return a}
function nowMin(){let d=new Date();return d.getHours()*60+d.getMinutes()}function until(t){return norm(t-nowMin())}function since(t){return norm(nowMin()-t)}
function afterCutoff(){return until(cfg.sleep)<norm(cfg.sleep-norm(cfg.sleep-480))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function h(title,sub){return `<div class="brand">${title}</div><div class="sub">${sub}</div>`}
function card(x,c=''){return `<section class="card ${c}">${x}</section>`}function section(s){return `<div class="section">${s}</div>`}
function line(a,b,c=''){return `<div class="line"><span class="muted">${a}</span><b class="${c}">${b}</b></div>`}
function score(d){let g=d.gentle?[5,15,10]:[8,30,20];return Math.min(100,Math.round(Math.min(1,d.water/g[0])*28+Math.min(1,d.move/g[1])*27+Math.min(1,d.light/g[2])*20+(d.checkin?15:0)+10))}
function action(d){let sw=since(cfg.wake),ts=until(cfg.sleep);if(ts<=75)return['Chuẩn bị hạ nhịp','Giảm ánh sáng mạnh, dừng caffeine và chọn một việc nhẹ để khép ngày.'];if(sw<120)return['Ánh sáng + nước',d.gentle?'Ra chỗ sáng vài phút và uống nước. Hôm nay thế là đủ để khởi động.':'Ưu tiên ánh sáng ngoài trời và vài ngụm nước trước khi đòi cơ thể chạy hết công suất.'];if(sw<360)return['Khối năng lượng chính','Nếu có việc khó, đây thường là cửa sổ đáng thử trước. Nghỉ ngắn sau mỗi khối tập trung.'];if(sw<720)return['Giữ nhịp ổn định','Đi bộ ngắn hoặc đổi tư thế có thể kéo năng lượng lên mà không cần thêm caffeine.'];return['Chuyển sang việc nhẹ','Để phần nặng sang cửa sổ tỉnh táo kế tiếp. Nhịp bền thường thắng cú tăng tốc muộn.']}
function today(){let d=data(),s=score(d),a=action(d),g=d.gentle?[5,15,10]:[8,30,20];return h('Flow','Ngày của bạn bắt đầu theo giờ thức, không theo 00:00.')+card(`<div class="eyebrow">FLOW HÔM NAY</div><div class="score">${s}/100</div><div class="bar"><div class="fill" style="width:${s}%"></div></div><div class="sub" style="margin:10px 0 0">${s>=80?'Nhịp hôm nay khá tròn. Đừng biến phần còn lại thành bài kiểm tra.':s>=50?'Đủ tốt để tiếp tục. Một việc nhỏ nữa là hợp lý.':'Chưa cần sửa cả ngày. Chọn một việc dễ nhất trước.'}</div>`,'hero')+section('Ngay lúc này')+card(`<div class="title">${a[0]}</div><div class="sub" style="margin:7px 0 0">${a[1]}</div>`)+section('Ba nhịp nhỏ')+`<div class="row">${card(`<b class="blue">${d.water}/${g[0]}</b><span class="muted">ly nước</span>`,'mini')}${card(`<b class="mint">${d.move}m</b><span class="muted">vận động</span>`,'mini')}${card(`<b class="amber">${d.light}m</b><span class="muted">ánh sáng</span>`,'mini')}</div>`+section('Mốc theo nhịp của bạn')+card(line('Thức',fmt(cfg.wake),'mint')+line('Ngưng caffeine',fmt(cfg.sleep-480),'amber')+line('Hạ nhịp',fmt(cfg.sleep-45),'blue')+line('Ngủ dự kiến',fmt(cfg.sleep)))+`<button class="btn" style="width:100%;margin-top:10px" onclick="gentle()">${d.gentle?'Đang ở chế độ nhẹ':'Hôm nay nhẹ thôi'}</button><div class="sub" style="text-align:center">${d.gentle?'Mục tiêu đã giảm bớt. Giữ nhịp quan trọng hơn cố hoàn hảo.':'Ngày mệt không cần biến thành cuộc thi chịu đựng.'}</div>`+section('Đặt lại 60 giây')+card(`<div class="breath"><div class="orb" id="orb"></div></div><button class="btn dark" style="width:100%" onclick="breathe()" id="breathBtn">Thở chậm 60 giây</button>`)}
function counter(title,metric,unit,target,step,color){let d=data(),v=d[metric];return card(`<div class="counter"><div><div class="title">${title}</div><div class="muted" style="font-size:12px">Mục tiêu ${target} ${unit}</div></div><div class="value ${color}">${v} ${unit}</div></div><div class="bar" style="margin-top:12px"><div class="fill" style="width:${Math.min(100,v/target*100)}%"></div></div><div class="controls"><button class="btn dark" onclick="bump('${metric}',-${step})">−${step}</button><button class="btn" onclick="bump('${metric}',${step})">+${step}</button></div>`)}
function track(){let d=data(),g=d.gentle?[5,15,10]:[8,30,20],late=afterCutoff();return h('Theo dõi',d.gentle?'Hôm nay đang nhẹ. Mục tiêu đã hạ xuống vừa đủ.':'Ghi nhanh vài thứ có ích. Không có chuỗi ngày nào đáng để tự phạt mình.')+counter('Nước','water','ly',g[0],1,'blue')+counter('Vận động','move','phút',g[1],5,'mint')+counter('Ánh sáng ngoài trời','light','phút',g[2],5,'amber')+card(`<div class="counter"><div><div class="title">Caffeine</div><div class="muted" style="font-size:12px">Mốc dừng ${fmt(cfg.sleep-480)}</div></div><div class="value ${late?'amber':'mint'}">${d.caffeine} lần</div></div>${late?'<div class="sub" style="color:#ffca77">Thử ánh sáng, nước hoặc đi lại vài phút trước khi thêm caffeine.</div>':''}<button class="btn ${late?'warn':''}" style="width:100%;margin-top:10px" onclick="caffeine()">+ Ghi một lần</button>`)+section('Check-in')+card(`<div class="title">Năng lượng</div>${scale('energy',d.energy)}<div class="title" style="margin-top:16px">Tâm trạng</div>${scale('mood',d.mood)}<button class="btn" style="width:100%;margin-top:14px" onclick="checkin()">Lưu check-in</button>`)}
function scale(k,v){return `<div class="scale">${[1,2,3,4,5].map(n=>`<button class="${v===n?'on':''}" onclick="rate('${k}',${n})">${n}</button>`).join('')}</div>`}
function rhythm(){return h('Nhịp','Đặt giờ ngủ và giờ thức thật của bạn. Flow xoay kế hoạch quanh nhịp đó.')+card(`<div class="muted">Giờ ngủ thường gặp</div><button class="time" onclick="pick('sleep')">${fmt(cfg.sleep)}</button><div class="muted" style="margin-top:14px">Giờ thức thường gặp</div><button class="time" onclick="pick('wake')">${fmt(cfg.wake)}</button>`)+section('Mẫu nhanh')+`<div class="row"><button class="btn dark preset" onclick="preset(1380,420)">23 → 07</button><button class="btn dark preset" onclick="preset(180,660)">03 → 11</button><button class="btn dark preset" onclick="preset(300,780)">05 → 13</button></div>`+section('Flow tự dịch các mốc')+card(line('Ánh sáng đầu ngày',`${fmt(cfg.wake)} – ${fmt(cfg.wake+90)}`,'amber')+line('Caffeine muộn nhất',fmt(cfg.sleep-480),'mint')+line('Hạ nhịp',fmt(cfg.sleep-45),'blue')+line('Ngày mới của Flow',fmt(cfg.wake)))+section('Nhắc nhẹ')+card(`<div class="toggleRow"><div><div class="title">Hai lời nhắc mỗi ngày</div><div class="muted" style="font-size:12px;margin-top:3px">Sau khi thức và trước lúc hạ nhịp.</div></div><div class="switch ${cfg.reminders?'on':''}" onclick="toggleReminders()"></div></div>`)}
function insights(){let ds=lastDays(),rows=ds.map(x=>get('d:'+x,null)).filter(Boolean),avg=k=>{let a=rows.map(x=>x[k]).filter(x=>x>0);return a.length?Math.round(a.reduce((p,c)=>p+c,0)/a.length):0},w=avg('water'),m=avg('move'),l=avg('light'),e=avg('energy'),mo=avg('mood'),ideas=[];if(rows.length<3)ideas.push('Ghi thêm 2–3 ngày để Flow nhìn ra xu hướng thay vì đoán từ một ngày thất thường.');else{if(w<5)ideas.push('Nước đang là nhịp dễ cải thiện nhất. Đặt chai nước ngay nơi bạn bắt đầu ngày.');if(m<20)ideas.push('Vận động đang thấp. Chia thành 3 đoạn 5–10 phút thường dễ giữ hơn một buổi dài.');if(l<15)ideas.push('Ánh sáng đầu ngày còn ít. Ghép nó với một việc vốn đã có, như uống nước hoặc bữa đầu.');if(e&&e<=2)ideas.push('Năng lượng gần đây thấp. Chế độ nhẹ có thể hợp hơn việc liên tục đẩy mục tiêu lên.');if(mo&&mo<=2)ideas.push('Tâm trạng gần đây thấp. Giữ mục tiêu nhỏ và ưu tiên nhịp ổn định trước khi tăng hoạt động.')}let late=rows.filter(x=>x.lateCaffeine).length;if(late)ideas.push(`${late} ngày gần đây có caffeine sau mốc dừng. Thử lùi lần cuối sớm hơn 30 phút mỗi vài ngày.`);if(!ideas.length)ideas.push('Nhịp tuần này khá cân. Giữ nguyên thêm vài ngày trước khi đổi mục tiêu.');return h('Góc nhìn','Tóm tắt 7 ngày gần nhất, tính theo ngày của Flow.')+`<div class="row">${card(`<b class="mint">${rows.length}</b><span class="muted">ngày có dữ liệu</span>`,'mini')}${card(`<b class="blue">${e||'–'}</b><span class="muted">năng lượng TB</span>`,'mini')}${card(`<b class="amber">${mo||'–'}</b><span class="muted">tâm trạng TB</span>`,'mini')}</div>`+section('Trung bình mỗi ngày')+card(line('Nước',`${w} ly`,'blue')+line('Vận động',`${m} phút`,'mint')+line('Ánh sáng',`${l} phút`,'amber'))+section('Flow gợi ý')+ideas.slice(0,3).map(x=>card(`<div style="line-height:1.5">• &nbsp;${x}</div>`)).join('')}
function journal(){let d=data(),hist=lastDays().map(x=>[x,get('d:'+x,null)]).filter(x=>x[1]?.note);return h('Nhật ký','Ghi điều cơ thể vừa nói, trước khi đầu óc viết lại câu chuyện.')+card(`<textarea id="note" class="note" placeholder="Ví dụ: tỉnh hơn sau khi đi bộ 15 phút; caffeine lúc 22:00 làm mình khó hạ nhịp...">${escapeHtml(d.note||'')}</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="saveNote()">Lưu nhật ký hôm nay</button>`)+section('7 ngày gần đây')+(hist.length?hist.map(([x,v])=>card(`<div class="eyebrow">${x.split('-').reverse().join('/')}</div><div class="history" style="margin-top:7px">${escapeHtml(v.note)}</div>`)).join(''):`<div class="empty">Chưa có ghi chú nào. Một dòng cũng được.</div>`)}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){app.innerHTML=tab==='today'?today():tab==='rhythm'?rhythm():tab==='track'?track():tab==='insights'?insights():journal();nav.innerHTML=[['today','Ngày'],['rhythm','Nhịp'],['track','Theo dõi'],['insights','Góc nhìn'],['journal','Nhật ký']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}
function go(t){if(breathTimer){clearTimeout(breathTimer);breathTimer=null}tab=t;render();scrollTo(0,0)}function gentle(){let d=data();d.gentle=!d.gentle;save(d);render()}function bump(k,n){let d=data();d[k]=Math.max(0,(d[k]||0)+n);save(d);render()}function caffeine(){let d=data();d.caffeine++;if(afterCutoff())d.lateCaffeine=true;save(d);render()}function rate(k,n){let d=data();d[k]=n;save(d);render()}function checkin(){let d=data();if(!d.energy||!d.mood){toast('Chọn cả hai mức trước');return}d.checkin=true;save(d);toast('Đã lưu cho ngày của bạn');render()}function saveNote(){let d=data();d.note=$('#note').value.trim();save(d);toast('Đã lưu trên thiết bị');render()}function pick(k){if(window.FlowNative)FlowNative.pickTime(k,cfg[k]);else{let v=prompt('HH:MM',fmt(cfg[k]));if(v){let p=v.split(':');onNativeTime(k,+p[0]*60+(+p[1]||0))}}}window.onNativeTime=(k,m)=>{cfg[k]=norm(m);set('cfg',cfg);if(cfg.reminders&&window.FlowNative)FlowNative.setReminders(true,cfg.sleep,cfg.wake);render()};function preset(s,w){cfg.sleep=s;cfg.wake=w;set('cfg',cfg);if(cfg.reminders&&window.FlowNative)FlowNative.setReminders(true,s,w);render()}function toggleReminders(){cfg.reminders=!cfg.reminders;set('cfg',cfg);if(window.FlowNative)FlowNative.setReminders(cfg.reminders,cfg.sleep,cfg.wake);render()}function breathe(){let o=$('#orb'),b=$('#breathBtn');if(!o)return;o.classList.add('go');b.textContent='Hít vào… thở ra…';b.disabled=true;breathTimer=setTimeout(()=>{breathTimer=null;toast('Xong một phút');render()},60000)}
render();if(cfg.reminders&&window.FlowNative)FlowNative.setReminders(true,cfg.sleep,cfg.wake);
</script></body></html>
